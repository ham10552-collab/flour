<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>دفتر الطحين</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --primary:#8A5A1F; --surface:#FAF6EF; --card:#fff; --gold:#C9A227;
  --green:#2E7D32; --red:#C62828; --text:#3E2E12; --muted:#8a7a5f; --line:#E4D8C0;
  --dark1:#1A1D29; --dark2:#2A2E3F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--text);
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  font-size:15px; line-height:1.5;
}
header{
  position:sticky; top:0; z-index:30; background:var(--surface);
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 10px; border-bottom:1px solid var(--line);
}
header h1{font-size:19px; font-weight:800; margin:0; letter-spacing:.2px}
#banner{display:none; background:#7a4e06; color:#ffe9c2; font-size:12.5px; font-weight:700; padding:7px 12px; text-align:center}
#banner.show{display:block}
#banner.ok{background:var(--green); color:#eaffea}
#hdrBtns{display:flex; align-items:center}
.icon-btn{
  background:none; border:none; color:var(--text); cursor:pointer;
  width:42px; height:42px; border-radius:12px; display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:1px;
}
.icon-btn:hover{background:rgba(138,90,31,.08)}
.icon-btn svg{display:block}
.htx{display:block;font-size:9.5px;font-weight:800;line-height:1.1}
.search{width:100%;box-sizing:border-box;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;font-family:inherit;margin-bottom:6px}
.search:focus{outline:none;border-color:var(--primary)}
.search::placeholder{color:var(--muted)}
main{max-width:760px; margin:0 auto; padding:14px 14px 110px}
.hidden{display:none !important}

.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:14px;
}
.card+.card{margin-top:10px}

.chips{display:flex; gap:8px; overflow-x:auto; padding:6px 2px 10px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:7px 18px; border-radius:999px; cursor:pointer;
  background:#fff; border:1px solid var(--line); color:var(--text);
  font-weight:800; font-size:14px; font-family:inherit;
}
.chip.sel{background:var(--primary); border-color:var(--primary); color:#fff}

.banner{display:flex; align-items:center; gap:10px}
.banner .b-title{flex:1; font-weight:800}
.banner .b-sacks{font-weight:800}
.banner svg{color:var(--primary); flex:none}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:10px; margin-top:12px}
@media (max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
.mtile{cursor:pointer; display:flex; flex-direction:column; min-height:128px; padding:11px}
.mtile .ic{
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center;
  justify-content:center; color:#fff; background:var(--gold);
}
.mtile .ic.off{background:#eee; color:#bdbdbd}
.mtile .sp{flex:1}
.mtile .m-name{font-weight:800; font-size:15px}
.mtile .m-sub{font-size:12px; color:var(--muted)}
.mtile .m-note{font-size:11px; color:var(--muted)}

.stats{display:flex; gap:10px; margin:4px 0 12px}
.stat{flex:1; background:#fff; border:1px solid var(--line); border-radius:16px; padding:11px}
.stat .lbl{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; font-weight:600}
.stat .val{font-size:16px; font-weight:800; margin-top:3px}

.tile{background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px 13px; cursor:pointer}
.tile+.tile{margin-top:10px}
.trow{display:flex; align-items:center; gap:10px}
.trow .grow{flex:1; min-width:0}
.tname{font-size:15.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tsub{font-size:12px; color:var(--muted)}
.avatar{
  width:38px; height:38px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
}
.avatar.gold{background:rgba(201,162,39,.15); color:var(--gold)}
.avatar.brown{background:rgba(138,90,31,.1); color:var(--primary)}
.mini{width:22px; height:22px; border-radius:9px; border:none; cursor:pointer; background:none; color:var(--muted); display:flex; align-items:center; justify-content:center; flex:none}
.mini:hover{background:rgba(0,0,0,.06)}
.mini.danger:hover{color:var(--red)}

.pill{
  display:inline-flex; align-items:center; gap:5px; padding:5px 11px;
  border-radius:999px; font-size:11.5px; font-weight:800; cursor:pointer; border:1.2px solid; flex:none;
}
.pill.on{background:rgba(46,125,50,.12); color:var(--green); border-color:var(--green)}
.pill.off{background:rgba(198,40,40,.10); color:var(--red); border-color:var(--red)}

.div{height:1px; background:#f0e9dc; margin:10px 0}
.info{display:flex; gap:6px; margin-top:10px}
.info .cell{flex:1; min-width:0}
.info .lbl{font-size:11px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:4px}
.info .lbl svg{color:var(--muted)}
.info .val{font-size:12.5px; font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.lastline{font-size:11px; color:var(--muted); margin-top:7px}

.profit{font-weight:800; white-space:nowrap}
.profit.pos{color:var(--green)}
.profit.neg{color:var(--red)}
.profit.neutral{color:var(--text)}

.grand{
  margin-top:12px; padding:16px; border-radius:16px; color:#fff;
  background:linear-gradient(135deg,var(--dark1),var(--dark2));
}
.grand .g-title{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; color:var(--gold)}
.grand .g-row{display:flex; gap:10px; margin-top:12px}
.grand .g-cell{flex:1}
.grand .g-lbl{font-size:11px; color:rgba(255,255,255,.75); font-weight:600}
.grand .g-val{font-size:14px; font-weight:800; margin-top:2px}

.fab{
  position:fixed; bottom:20px; left:20px; z-index:40;
  background:var(--primary); color:#fff; border:none; border-radius:16px;
  padding:15px 20px; font-size:15px; font-weight:800; font-family:inherit;
  display:flex; align-items:center; gap:8px; cursor:pointer;
  box-shadow:0 6px 20px rgba(138,90,31,.35);
}
.empty{text-align:center; padding:60px 20px; color:var(--muted)}
.empty .e-ic{color:var(--gold); margin-bottom:10px}
.empty .e-t{font-size:16px; font-weight:800; color:var(--text)}
.empty .e-s{font-size:13px; margin-top:4px}

.chipbox{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; background:#f4f0e7; font-size:12px; font-weight:700; color:var(--text)}
.chipbox.gold{background:rgba(46,125,50,.12); color:var(--green)}
.chipbox.silver{background:rgba(198,40,40,.10); color:var(--red)}
.tx-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}

.report{border:none; padding:0; overflow:hidden}
.report>summary{list-style:none; display:flex; align-items:center; gap:10px; padding:13px; cursor:pointer}
.report>summary::-webkit-details-marker{display:none}
.report>summary .badge{width:34px; height:34px; border-radius:50%; background:rgba(201,162,39,.15); color:var(--gold); font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
.r-title{font-weight:800}
.r-sub{font-size:12px; color:var(--muted)}
.report .rep-body{padding:0 13px 10px; border-top:1px solid var(--line)}
.mill-sec{padding:10px 0 2px}
.mill-sec summary{list-style:none; display:flex; align-items:center; gap:10px; cursor:pointer; padding:4px 0}
.mill-sec summary::-webkit-details-marker{display:none}
.mill-sec .m-name{font-weight:700; font-size:14px}
.mill-sec .m-sub{font-size:12px; color:var(--muted)}
.agent-row{display:flex; align-items:center; gap:10px; padding:6px 4px}
.agent-row .a-name{flex:1; font-size:13.5px}
.rep-body .r-h{display:flex; align-items:center; gap:8px; padding:3px 0}

.overlay{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center}
.overlay.center{align-items:center}
.backdrop{position:absolute; inset:0; background:rgba(30,25,15,.45)}
.sheet{
  position:relative; width:100%; max-width:760px; max-height:92vh; overflow-y:auto;
  background:var(--surface); border-radius:20px 20px 0 0; padding:14px 16px 24px;
  animation:up .18s ease-out;
}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
.sheet-head h3{margin:0; font-size:17px; font-weight:800}
.dialog{
  position:relative; width:calc(100% - 40px); max-width:380px;
  background:#fff; border-radius:18px; padding:20px; animation:up .15s ease-out;
}
.dialog h3{margin:0 0 6px; font-size:16.5px}
.dialog p{margin:0 0 18px; color:#5c5240; font-size:14px}
.dbtn-row{display:flex; gap:10px; justify-content:flex-end}
.btn{
  border:none; border-radius:12px; padding:11px 20px; font-size:14.5px; font-weight:800;
  font-family:inherit; cursor:pointer;
}
.btn.primary{background:var(--primary); color:#fff}
.btn.ghost{background:#f1ece1; color:var(--text)}
.btn.danger{background:var(--red); color:#fff}
.btn:active{opacity:.85}
.btn-block{width:100%; margin-top:9px}
.btn.link{background:none; color:var(--primary); text-decoration:underline; width:100%; margin-top:6px; padding:8px}

.field{display:block; margin-bottom:13px}
.field>span{display:block; font-size:12.5px; font-weight:700; color:#6b5e45; margin-bottom:5px}
.field input, .field textarea{
  width:100%; border:1px solid var(--line); border-radius:13px; background:#fff;
  padding:11px 12px; font-size:15px; font-family:inherit; color:var(--text); outline:none;
}
.field input:focus,.field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 2px rgba(138,90,31,.12)}
.field textarea{resize:vertical; min-height:60px}
input[type=date]{direction:ltr; text-align:right}
.switch-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:#fff; border:1px solid var(--line); border-radius:13px; padding:11px 13px;
  font-size:14px; font-weight:700; margin-top:4px; cursor:pointer;
}
.switch-row input{display:none}
.switch-row .track{
  width:46px; height:26px; border-radius:999px; background:#d8d0c0; position:relative; flex:none; transition:.15s;
}
.switch-row .track::after{
  content:""; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
  background:#fff; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch-row input:checked+.track{background:var(--green)}
.switch-row input:checked+.track::after{right:23px}

.menu{
  position:fixed; top:54px; right:12px; z-index:50; background:#fff; border:1px solid var(--line);
  border-radius:14px; box-shadow:0 8px 26px rgba(60,45,15,.18); overflow:hidden; min-width:210px;
}
.menu-user{padding:11px 16px 7px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); word-break:break-all}
.menu button{
  display:block; width:100%; text-align:right; border:none; background:none; cursor:pointer;
  padding:12px 16px; font-size:14px; font-family:inherit; color:var(--text); font-weight:600;
}
.menu button:hover{background:var(--surface)}

#toast{
  position:fixed; bottom:92px; left:50%; transform:translateX(-50%) translateY(20px); z-index:90;
  background:#2b2417; color:#fff; padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:700;
  opacity:0; pointer-events:none; transition:.2s; white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
@media (min-width:520px){ #toast{white-space:normal; text-align:center} }

.auth-wrap{display:flex; justify-content:center; padding:9vh 16px; min-height:70vh}
.auth-card{width:100%; max-width:400px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:26px 22px; text-align:center}
.auth-logo{
  width:64px; height:64px; border-radius:18px; margin:0 auto 12px; color:#fff; background:var(--gold);
  display:flex; align-items:center; justify-content:center;
}
.auth-card h2{margin:0 0 4px; font-size:21px}
.auth-sub{color:var(--muted); font-size:13px; margin:0 0 18px}
.auth-err{color:var(--red); font-size:13px; min-height:18px; margin:2px 0 4px; font-weight:600}
.cfg-card{text-align:right}
.cfg-card ol{margin:8px 0 0; padding-right:20px}
.cfg-card li{margin-bottom:7px; font-size:13.5px; color:#5c5240}
</style>
</head>
<body>

<header>
  <button class="icon-btn hidden" id="backBtn"></button>
  <h1 id="title">دفتر الطحين</h1>
  <div id="hdrBtns">
    <button class="icon-btn" id="reportBtn"></button>
    <button class="icon-btn" id="menuBtn"></button>
  </div>
</header>

<div id="banner"></div>

<main id="main"></main>

<div id="menu" class="menu hidden"></div>
<div id="sheetWrap" class="overlay hidden">
  <div class="backdrop" id="sheetBack"></div>
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button class="icon-btn" id="sheetClose"></button>
    </div>
    <form id="sheetForm"></form>
  </div>
</div>
<div id="dialogWrap" class="overlay center hidden">
  <div class="backdrop" id="dialogBack"></div>
  <div class="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg"></p>
    <div class="dbtn-row">
      <button class="btn ghost" id="dlgNo">إلغاء</button>
      <button class="btn primary" id="dlgOk">حذف</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>

var LS_CACHE='flour_cache_';
var MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function freshDB(){return {seq:0,currency:'د.ع',mills:[],agents:[],txs:[],years:[]};}
function normDB(d){
  if(typeof d.seq!=='number')d.seq=0;
  if(typeof d.currency!=='string')d.currency='د.ع';
  if(!Array.isArray(d.mills))d.mills=[];
  if(!Array.isArray(d.agents))d.agents=[];
  if(!Array.isArray(d.txs))d.txs=[];
  if(!Array.isArray(d.years))d.years=[];
  var i;
  for(i=0;i<d.agents.length;i++){
    if(d.agents[i].delivered===undefined)d.agents[i].delivered=0;
    if(d.agents[i].settled===undefined)d.agents[i].settled=0;
  }
  for(i=0;i<d.txs.length;i++){
    if(d.txs[i].delivered===undefined)d.txs[i].delivered=0;
    if(d.txs[i].paid===undefined)d.txs[i].paid=0;
  }
  return d;
}

var DB=freshDB();
var AUTH='boot',UID=null,USER_EMAIL='',PS='',SAVE_TIMER=null,SYNC_WATCH=null,CLOUD_POLL=null,CLOUD_KEY=null,CLOUD_ETAG=null,_dirty=false,_codeShown=false,REG='',AGF='all',SQ='',JOINCODE='';

function bytesToB64(buf){
  var s='',u8=new Uint8Array(buf);
  for(var i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}
function b64ToBytes(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function sha(s){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))
    .then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');});
}
function deriveKey(em,ps){
  var salt=em.toLowerCase().trim();
  return crypto.subtle.importKey('raw',new TextEncoder().encode(salt+'|'+ps),{name:'PBKDF2'},false,['deriveKey'])
    .then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('flour-salt-'+salt),iterations:50000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});
}
function encDb(d,key){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(d)))
    .then(function(ct){return {iv:bytesToB64(iv),c:bytesToB64(ct)};});
}
function decDb(p,key){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(p.iv)},key,b64ToBytes(p.c))
    .then(function(plain){return JSON.parse(new TextDecoder().decode(plain));})
    .catch(function(){return null;});
}
function blobId(em){return sha('flour-blob-'+em.toLowerCase().trim());}
function withTimeout(p,ms){
  return Promise.race([p,new Promise(function(res){setTimeout(function(){res(false);},ms);})]);
}
function cloudGet(){
  if(!CLOUD_KEY)return Promise.resolve({st:404});
  return withTimeout(fetch('https://jsonblob.com/api/jsonBlob/'+CLOUD_KEY,{method:'GET'}).then(function(r){
    if(r.status===200)return r.json().then(function(j){return {st:200,etag:r.headers.get('ETag'),j:j};});
    return {st:r.status};
  }).catch(function(){return {st:0};}),12000);
}
function cloudCreate(p){
  return withTimeout(fetch('https://jsonblob.com/api/jsonBlob',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
    .then(function(r){
      if(r.status===201){
        var loc=r.headers.get('Location');
        if(loc)CLOUD_KEY=loc.split('/').pop();
        CLOUD_ETAG=r.headers.get('ETag');
        return true;
      }
      return false;
    }).catch(function(){return false;}),15000);
}
function cloudPut(p){
  if(!CLOUD_KEY)return cloudCreate(p);
  var h={'Content-Type':'application/json'};
  if(CLOUD_ETAG)h['If-Match']=CLOUD_ETAG;
  return withTimeout(fetch('https://jsonblob.com/api/jsonBlob/'+CLOUD_KEY,{method:'PUT',headers:h,body:JSON.stringify(p)})
    .then(function(r){
      if(r.status===200||r.status===201){CLOUD_ETAG=r.headers.get('ETag');return true;}
      if(r.status===412){
        return cloudGet().then(function(g){
          if(g.st===200&&g.etag){CLOUD_ETAG=g.etag;return cloudPut(p);}
          if(g.st===404)return cloudCreate(p);
          return false;
        });
      }
      if(r.status===404)return cloudCreate(p);
      return false;
    }).catch(function(){return false;}),15000);
}

function cacheWrite(){
  try{
    var k=LS_CACHE+'e:'+USER_EMAIL.toLowerCase(),d={},ss=null;
    if(USER_EMAIL&&PS&&WANT_SS)ss=[USER_EMAIL.toLowerCase(),PS];
    else{
      try{var p=JSON.parse(localStorage.getItem(k)||'null');if(p&&Array.isArray(p._ss))ss=p._ss;}catch(e){}
    }
    for(var key in DB)d[key]=DB[key];
    if(ss)d._ss=ss;
    localStorage.setItem(k,JSON.stringify(d));
  }catch(e){}
}
function save(){
  cacheWrite();
  if(AUTH!=='ready')return;
  _dirty=true;
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER=setTimeout(saveNow,250);
}
function saveNow(){
  cacheWrite();
  if(AUTH!=='ready')return Promise.resolve();
  clearTimeout(SAVE_TIMER);
  _dirty=true;
  return deriveKey(USER_EMAIL,PS).then(function(key){
    return encDb(DB,key);
  }).then(function(p){
    return CLOUD_KEY?cloudPut(p):cloudCreate(p);
  }).then(function(ok){
    if(ok){
      _dirty=false;clearBanner();
      if(CLOUD_KEY&&CLOUD_KEY.indexOf('-')>=0&&JOINCODE!==CLOUD_KEY){JOINCODE=CLOUD_KEY;try{localStorage.setItem('flour_jc_'+USER_EMAIL.toLowerCase(),CLOUD_KEY);}catch(e){}}
      var _jcPersisted=false;try{_jcPersisted=!!localStorage.getItem('flour_jc_'+USER_EMAIL.toLowerCase());}catch(e){}
      if(!_codeShown&&AUTH==='ready'&&CLOUD_KEY&&CLOUD_KEY.indexOf('-')>=0&&!_jcPersisted){
        _codeShown=true;
        setTimeout(function(){alert('رمز الربط لربط جوالك الثاني (ينسخ من القائمة):\n\n'+CLOUD_KEY);},800);
      }
    }
    else{showBanner('لا يوجد اتصال بالسحابة الآن — بياناتك محفوظة بجوالك، وسنعيد المحاولة تلقائياً','err');}
  });
}
function newId(){return ++DB.seq;}

function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtNum(v){v=Math.round(v*100)/100;return v.toLocaleString('en-US',{maximumFractionDigits:2});}
function fmtSacks(v){return fmtNum(v)+' كيس';}
function fmtMoney(v){return fmtNum(v)+' '+DB.currency;}
function fmtDate(s){var p=String(s).split('-');return (+p[2])+' '+MONTHS[(+p[1])-1]+' '+p[0];}
function monthName(m){return MONTHS[m-1];}
function parsenum(v){if(v===null||v===undefined)return 0;var n=parseFloat(String(v).replace(/[^\d.]/g,''));return isNaN(n)?0:n;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function txTotals(t){var c=t.sacks*t.buy,r=t.sacks*t.sell;return {sacks:t.sacks,cost:c,revenue:r,profit:r-c};}
function sumTotals(list){var o={sacks:0,cost:0,revenue:0,profit:0};for(var i=0;i<list.length;i++){o.sacks+=list[i].sacks;o.cost+=list[i].cost;o.revenue+=list[i].revenue;o.profit+=list[i].profit;}return o;}

function byName(a,b){return a.name.localeCompare(b.name,'ar');}
function millById(id){for(var i=0;i<DB.mills.length;i++)if(DB.mills[i].id===id)return DB.mills[i];return null;}
function agentById(id){for(var i=0;i<DB.agents.length;i++)if(DB.agents[i].id===id)return DB.agents[i];return null;}
function years(){var s={};for(var i=0;i<DB.mills.length;i++)s[DB.mills[i].year]=1;return Object.keys(s).map(Number).sort(function(a,b){return a-b;});}
function millsForPeriod(y,m){return DB.mills.filter(function(x){return x.year===y&&x.month===m;}).sort(byName);}
function millsForYear(y){return DB.mills.filter(function(x){return x.year===y;}).sort(function(a,b){return a.month-b.month||byName(a,b);});}
function agentsForMill(id){return DB.agents.filter(function(x){return x.millId===id;}).sort(byName);}
function txsForAgent(id){return DB.txs.filter(function(x){return x.agentId===id;}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id-a.id;});}
function txsRowsForYear(y){
  var am={},mm={},i;
  for(i=0;i<DB.agents.length;i++)am[DB.agents[i].id]=DB.agents[i];
  for(i=0;i<DB.mills.length;i++)mm[DB.mills[i].id]=DB.mills[i];
  var rows=[];
  for(i=0;i<DB.txs.length;i++){
    var t=DB.txs[i],a=am[t.agentId]; if(!a)continue;
    var m=mm[a.millId]; if(!m||m.year!==y)continue;
    rows.push({t:t,a:a,m:m});
  }
  rows.sort(function(x,z){return x.m.month-z.m.month||byName(x.m,z.m)||byName(x.a,z.a)||(x.t.date<z.t.date?-1:x.t.date>z.t.date?1:0);});
  return rows;
}

var S={screen:'home',year:new Date().getFullYear(),month:1,millId:null,agentId:null};

function go(screen,extra){for(var k in extra)S[k]=extra[k];S.screen=screen;render();window.scrollTo(0,0);}
function goBack(){
  if(S.screen==='month'||S.screen==='report'||S.screen==='agentsall')go('home');
  else if(S.screen==='agents'){var m=millById(S.millId);if(m)go('month',{year:m.year,month:m.month});else go('home');}
  else if(S.screen==='tx'){var a=agentById(S.agentId);if(a)go('agents',{millId:a.millId});else go('home');}
}
function agentFilterChips(){
  var defs=[['all','كل الوكلاء'],['settled','حاسبتهم'],['unsettled','بعدني محاسبهم']],h='<div class="chips">';
  for(var i=0;i<defs.length;i++)h+='<button class="chip'+(AGF===defs[i][0]?' sel':'')+'" data-act="agent-filter" data-f="'+defs[i][0]+'">'+defs[i][1]+'</button>';
  return h+'</div>';
}
function agentPassesFilter(a){
  if(AGF==='settled')return a.settled==1;
  if(AGF==='unsettled')return a.settled!=1;
  return true;
}
function agentNameOk(a){return !SQ||(a.name||'').indexOf(SQ)>=0;}
function ensureCode(){
  if(JOINCODE){alert('رمز الربط (الصقه بالجوال الثاني بشاشة الدخول تحت "عندي رمز ربط"):\n\n'+JOINCODE);return;}
  if(CLOUD_KEY&&CLOUD_KEY.indexOf('-')>=0){JOINCODE=CLOUD_KEY;try{localStorage.setItem('flour_jc_'+USER_EMAIL.toLowerCase(),CLOUD_KEY);}catch(e){}alert('رمز الربط (الصقه بالجوال الثاني بشاشة الدخول تحت "عندي رمز ربط"):\n\n'+CLOUD_KEY);return;}
  toast('جاري تجهيز رمز الربط…');
  saveNow().then(function(){
    if(JOINCODE)alert('رمز الربط (الصقه بالجوال الثاني بشاشة الدخول تحت "عندي رمز ربط"):\n\n'+JOINCODE);
    else toast('ما صار اتصال بالسحابة حالياً — جرّب مرة أخرى بعد قليل');
  });
}
function copyCode(){
  if(!JOINCODE){ensureCode();return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(JOINCODE).then(function(){toast('تم نسخ الرمز — الصقه بجوالك الثاني');},function(){alert(JOINCODE);});}
  else alert(JOINCODE);
}

function stat(lbl,val,ic){return '<div class="stat"><div class="lbl">'+ic+'<span>'+lbl+'</span></div><div class="val">'+val+'</div></div>';}
function profitLabel(p){return '<span class="profit '+(p>0?'pos':p<0?'neg':'neutral')+'">'+fmtMoney(p)+'</span>';}
function yearChips(sel){
  var ys=years(),s={};s[sel]=1;s[new Date().getFullYear()]=1;
  for(var i=0;i<DB.years.length;i++)s[DB.years[i]]=1;
  for(i=0;i<ys.length;i++)s[ys[i]]=1;
  var all=Object.keys(s).map(Number).sort(function(a,b){return a-b;});
  var h='<div class="chips">';
  for(i=0;i<all.length;i++)h+='<button class="chip'+(all[i]===sel?' sel':'')+'" data-act="year" data-year="'+all[i]+'">'+all[i]+'</button>';
  h+='<button class="chip" data-act="add-year" style="color:var(--primary);border-style:dashed">+ سنة</button>';
  return h+'</div>';
}
function emptyState(ic,t,s){return '<div class="empty"><div class="e-ic">'+ic+'</div><div class="e-t">'+t+'</div><div class="e-s">'+s+'</div></div>';}

function agentsHtml(){
  var mill=millById(S.millId);
  if(!mill)return emptyState(I.empty,'المطحنة غير موجودة','');
  var agents=agentsForMill(mill.id);
  var rows=txsRowsForYear(mill.year);
  var byAgent={},latest={},i;
  for(i=0;i<rows.length;i++){
    if(rows[i].m.id!==mill.id)continue;
    var t=txTotals(rows[i].t),e=byAgent[rows[i].a.id];
    if(!e){e={sacks:0,cost:0,revenue:0,profit:0};byAgent[rows[i].a.id]=e;}
    e.sacks+=t.sacks;e.cost+=t.cost;e.revenue+=t.revenue;e.profit+=t.profit;
    var L=latest[rows[i].a.id];
    if(!L||rows[i].t.date>L.date)latest[rows[i].a.id]=rows[i].t;
  }
  var tot=sumTotals(Object.keys(byAgent).map(function(k){return byAgent[k];}));
  var h='<div class="card banner" style="margin-bottom:10px"><span style="display:flex">'+I.store+'</span><div class="b-title">'+esc(mill.name)+'</div></div>';
  h+='<div class="stats">'+stat('الوكلاء',agents.length,I.person)+stat('أكياس المطحنة',fmtSacks(tot.sacks),I.sacks)+'</div>';
  h+='<div class="chips"><input class="search" id="agSearch" value="'+esc(SQ)+'" placeholder="بحث عن وكيل بالاسم…" oninput="SQ=this.value;render();var i=document.getElementById(\'agSearch\');if(i){i.focus();var v=i.value;i.setSelectionRange(v.length,v.length);}"></div>'+agentFilterChips();
  var list=agents.filter(function(x){return agentPassesFilter(x)&&agentNameOk(x);});
  if(!list.length){
    h+=emptyState(I.truck2,(agents.length?'لا يوجد وكيل بهذا الاسم أو الفلتر المختار':'لا يوجد وكلاء في هذه المطحنة'),(agents.length?'غيّر نص البحث أو اختر فلتراً آخر':'أضف أول وكيل تتعامل معه'));

function authMsg(e){
  if(e&&e.err==='noacc')return 'ما عندك حساب بهذا البريد — اضغط تسجيل حساب جديد';
  if(e&&e.err==='wrong')return 'كلمة المرور غلط — أو لو نسيت كلمة المرور فبياناتك ما تترجع (مفتاحك الخاص)';
  if(e&&e.err==='taken')return 'هذا البريد مسجل مسبقاً — ادخل بكلمة مروره';
  if(e&&e.err==='net')return 'لا يوجد اتصال بالإنترنت — جرّب مرة أخرى';
  if(e&&e.err==='timeout')return 'الاتصال بطيء أو مقطوع — تأكد من النت وحاول مجدداً';
  return 'حصل خطأ — حاول مرة ثانية';
}

var WANT_SS=true;
function wantsSS(){
  var el=document.getElementById('authRemember');
  if(el)WANT_SS=el.checked;
  return WANT_SS;
}
function finishLogin(em){
  USER_EMAIL=em.toLowerCase();
  if(wantsSS()){saveSession();}
  else{
    dropSS();
    try{
      var k=LS_CACHE+'e:'+USER_EMAIL.toLowerCase();
      var o=JSON.parse(localStorage.getItem(k)||'null');
      if(o&&o._ss){delete o._ss;localStorage.setItem(k,JSON.stringify(o));}
    }catch(e){}
  }
  toast('تم الدخول — أهلاً بعودتك، دفترك جاهز');
  startSession();
}
function cloudTry(em,ps,mode){
  var codeEl=document.getElementById('authCode');
  REG=codeEl?(codeEl.value||'').trim():'';
  return (REG?Promise.resolve(REG):blobId(em)).then(function(id){
    CLOUD_KEY=id;
    return cloudGet();
  }).then(function(g){
    if(g&&g.st===404){return {st:'noc'};}
    if(g&&g.st===200){
      return deriveKey(em,ps).then(decDb.bind(null,g.j)).then(function(d){
        if(d)return {st:'ok',d:d,etag:g.etag};
        return {st:'wrong'};
      });
    }
    return {st:'net'};
  }).catch(function(){return {st:'net'};});
}
function readSS(){
  var v=null;try{v=JSON.parse(localStorage.getItem('flour_ss')||'null');}catch(e){}
  if(!v){try{var m=document.cookie.match(/(?:^|;\s*)flour_ssc=([^;]+)/);if(m)v=JSON.parse(decodeURIComponent(m[1]));}catch(e){}}
  return v;
}
function writeSS(v){
  try{localStorage.setItem('flour_ss',JSON.stringify(v));}catch(e){}
  try{document.cookie='flour_ssc='+encodeURIComponent(JSON.stringify(v))+';path=/;max-age=31536000';}catch(e){}
}
function dropSS(){
  try{localStorage.removeItem('flour_ss');}catch(e){}
  try{document.cookie='flour_ssc=;path=/;max-age=0';}catch(e){}
}
function showWaiting(){
  var m=document.getElementById('main');
  if(m)m.innerHTML='<div class="auth-wrap"><div class="auth-card"><div class="auth-logo">'+I.store+'</div><h2>دفتر الطحين</h2><p class="auth-sub">جاري فتح دفترك…</p></div></div>';
}
function restoreFromCache(em){
  var cached=null;
  try{cached=JSON.parse(localStorage.getItem(LS_CACHE+'e:'+em.toLowerCase())||'null');}catch(e){}
  if(!(cached&&Array.isArray(cached.mills))){
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf('flour_cache_')===0){
        try{var o=JSON.parse(localStorage.getItem(k));
          if(o&&Array.isArray(o.mills)){
            var em2=o._ss?o._ss[0]:null;
            if(em2&&em2.toLowerCase()===em.toLowerCase()&&(!cached||(o.txs||[]).length>(cached.txs||[]).length))cached=o;
          }
        }catch(e){}
      }
    }
  }
  return cached;
}
function autoLogin(em,ps){
  AUTH='login';
  USER_EMAIL=em.toLowerCase();PS=ps;REG='';
  showWaiting();
  cloudTry(em,ps,'login').then(function(r){
    var cached=null;
    try{cached=JSON.parse(localStorage.getItem(LS_CACHE+'e:'+em.toLowerCase())||'null');}catch(e){}
    if(r&&r.st==='ok'){DB=normDB(r.d);CLOUD_ETAG=r.etag;clearBanner();finishLogin(em);}
    else if(cached&&Array.isArray(cached.mills)){DB=normDB(cached);clearBanner();finishLogin(em);}
    else {clearBanner();render();}
  });
}

function bindAuth(){
  var errEl=document.getElementById('authErr');
  var btnL=document.getElementById('btnLogin'),btnS=document.getElementById('btnSignup'),btnR=document.getElementById('btnReset');
  function showErr(m){if(errEl)errEl.textContent=m;}
  function creds(){
    var codeEl=document.getElementById('authCode');
    return {em:document.getElementById('authEmail').value.trim(),ps:document.getElementById('authPass').value,code:codeEl?codeEl.value.trim():''};
  }
  function online(){if(!navigator.onLine){showErr('لا يوجد اتصال بالإنترنت');return false;}return true;}
  var bC=document.getElementById('btnCode');
  if(bC)bC.onclick=function(){
    var r=document.getElementById('codeRow');if(!r)return;
    r.classList.remove('hidden');bC.classList.add('hidden');
    var i=document.getElementById('authCode');if(i)try{i.focus();}catch(e){}
  };
  if(btnL)btnL.onclick=function(){
    var c=creds();
    if(!c.em||!c.ps){showErr('اكتب البريد وكلمة المرور');return;}
    if(!online())return;
    showErr('');btnL.textContent='جاري الدخول...';
    var t=setTimeout(function(){btnL.textContent='دخول';showErr(authMsg({err:'timeout'}));},20000);
    cloudTry(c.em,c.ps,'login').then(function(r){
      clearTimeout(t);btnL.textContent='دخول';
      if(r.st==='ok'){DB=normDB(r.d);CLOUD_ETAG=r.etag;finishLogin(c.em);}
      else if(r.st==='noc'){
        var cached=null;
        try{var lr=localStorage.getItem(LS_CACHE+'e:'+c.em.toLowerCase());if(lr)cached=JSON.parse(lr);}catch(e){}
        if(cached&&Array.isArray(cached.mills)){DB=normDB(cached);finishLogin(c.em);}
        else showErr('ما توجد بيانات سحابية بهذا الحساب — إن كان لك بيانات بهذا الجوال اضغط "تسجيل حساب جديد" ليُعاد رفعها، أو الصق رمز الربط من جوالك الأول');
      }
      else if(r.st==='wrong'){PS='';showErr(authMsg({err:'wrong'}));}
      else showErr(authMsg({err:'net'}));
    });
  };
  if(btnS)btnS.onclick=function(){
    var c=creds();
    if(!c.em||!c.ps){showErr('اكتب البريد وكلمة المرور');return;}
    if(!online())return;
    showErr('');btnS.textContent='جاري إنشاء الحساب...';
    var t=setTimeout(function(){btnS.textContent='تسجيل حساب جديد';showErr(authMsg({err:'timeout'}));},20000);
    cloudTry(c.em,c.ps,'signup').then(function(r){
      clearTimeout(t);btnS.textContent='تسجيل حساب جديد';
      if(r.st==='noc'){finishLogin(c.em);toast('تم إنشاء حسابك — بياناتك راح تُرفع للسحابة');}
      else if(r.st==='ok'){PS='';showErr(authMsg({err:'taken'}));}
      else if(r.st==='wrong'){PS='';showErr(authMsg({err:'taken'}));}
      else showErr(authMsg({err:'net'}));
    });
  };
  if(btnR)btnR.onclick=function(){
    showErr('كلمة المرور هي مفتاح بياناتك الخاص ولا يمكن استرجاعها — احفظها جيداً');
  };
}

function startSession(){
  AUTH='ready';
  try{JOINCODE=localStorage.getItem('flour_jc_'+USER_EMAIL.toLowerCase())||'';}catch(e){}
  var cached=null;
  try{var r=localStorage.getItem(LS_CACHE+'e:'+USER_EMAIL.toLowerCase());if(r)cached=JSON.parse(r);}catch(e){}
  if(!(cached&&Array.isArray(cached.mills))){
    for(var k=0;k<localStorage.length;k++){
      var key=localStorage.key(k);
      if(key&&key.indexOf('flour_cache_')===0){
        try{var o=JSON.parse(localStorage.getItem(key));
          if(o&&Array.isArray(o.mills)&&(!cached||(o.txs||[]).length>(cached.txs||[]).length))cached=o;
        }catch(er){}
      }
    }
  }
  DB=(cached&&Array.isArray(cached.mills))?normDB(cached):freshDB();
  S.screen='home';S.year=new Date().getFullYear();S.millId=null;S.agentId=null;
  render();
  syncCloud();
}
function syncCloud(){
  if(AUTH!=='ready')return;
  clearTimeout(SYNC_WATCH);
  SYNC_WATCH=setTimeout(function(){
    clearTimeout(SYNC_WATCH);SYNC_WATCH=null;
    showBanner('جاري الاتصال بالسحابة… إن استمرت المشكلة تأكد من النت','err');
  },8000);
  cloudGet().then(function(g){
    clearTimeout(SYNC_WATCH);SYNC_WATCH=null;
    if(g.st===200){
      return deriveKey(USER_EMAIL,PS).then(decDb.bind(null,g.j)).then(function(d){
        if(!d)return;
        if(JSON.stringify(d)!==JSON.stringify(DB)){DB=normDB(d);cacheWrite();render();toast('تم تحديث البيانات من الأجهزة الأخرى');}
        CLOUD_ETAG=g.etag;
        clearBanner();
        if(_dirty)saveNow();
      });
    }
    if(g.st===404){
      if(DB&&DB.mills)saveNow();
      else clearBanner();
      return;
    }
    clearBanner();
    showBanner('لا يوجد اتصال بالسحابة الآن — بياناتك محفوظة بجوالك، وسنعيد المحاولة تلقائياً','err');
  });
}
function attachSync(){
  clearTimeout(CLOUD_POLL);
  CLOUD_POLL=setTimeout(function(){
    if(AUTH!=='ready')return;
    syncCloud();
    attachSync();
  },15000);
}
function syncNow(){
  MENU.classList.add('hidden');
  saveNow().then(function(){syncCloud();attachSync();});
  toast('تم إرسال طلب المزامنة');
}
function showBanner(msg,cls){
  var b=document.getElementById('banner');

  b.className=cls==='ok'||cls==='err'?('show '+cls):'show';
}
function clearBanner(){
  var b=document.getElementById('banner');
  b.className='';
  b.textContent='';
}
function isDoc(d){return d&&Array.isArray(d.mills);}
function applyDoc(d){return normDB(d);}

function endSession(){
  clearTimeout(SAVE_TIMER);
  clearTimeout(CLOUD_POLL);
  clearTimeout(SYNC_WATCH);
  clearSession();
  AUTH='login';UID=null;USER_EMAIL='';PS='';CLOUD_KEY=null;CLOUD_ETAG=null;_dirty=false;REG='';_codeShown=false;
  S.screen='home';S.millId=null;S.agentId=null;
  DB=freshDB();

}
function saveSession(){
  writeSS([USER_EMAIL.toLowerCase(),PS]);
  cacheWrite();
}
function clearSession(){
  dropSS();
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(LS_CACHE)===0){
        try{var o=JSON.parse(localStorage.getItem(k));if(o&&o._ss){delete o._ss;localStorage.setItem(k,JSON.stringify(o));}}catch(e){}
      }
    }
  }catch(e){}
}

function render(){
  var title=document.getElementById('title');
  var bb=document.getElementById('backBtn');
  var hb=document.getElementById('hdrBtns');
  var oldFab=document.querySelector('.fab');if(oldFab)oldFab.remove();
  if(AUTH!=='ready'){
    title.textContent='دفتر الطحين';
    bb.classList.add('hidden');hb.classList.add('hidden');MENU.classList.add('hidden');
    MAIN.innerHTML=loginHtml();
    bindAuth();
    return;
  }
  bb.classList.remove('hidden');hb.classList.remove('hidden');
  var back=false,body='',fab=null;
  if(S.screen==='report'){back=true;title.textContent='النتائج النهائية';body=reportHtml();}
  else if(S.screen==='agentsall'){back=true;title.textContent='الوكلاء حسب المحاسبة';body=agentsAllHtml();}
  else if(S.screen==='month'){back=true;title.textContent='مطاحن شهر '+S.month;body=monthHtml();fab={act:'add-mill',label:'مطحنة جديدة'};}
  else if(S.screen==='agents'){back=true;title.textContent='الوكلاء';body=agentsHtml();fab={act:'add-agent',label:'وكيل جديد'};}
  else if(S.screen==='tx'){back=true;title.textContent='عمليات الوكيل';body=txHtml();fab={act:'add-tx',label:'عملية جديدة'};}
  else {title.textContent='دفتر الطحين';body=homeHtml();}
  bb.classList.toggle('hidden',!back);
  MAIN.innerHTML=body;
  if(fab){
    var b=document.createElement('button');
    b.className='fab';b.dataset.act=fab.act;b.innerHTML=I.add+'<span>'+fab.label+'</span>';
    document.body.appendChild(b);
  }
}

var SHEET=document.getElementById('sheetWrap');
var SHEET_FORM=document.getElementById('sheetForm');
var SHEET_TITLE=document.getElementById('sheetTitle');
function openSheet(title,fieldsHtml,onSubmit){
  SHEET_TITLE.textContent=title;
  SHEET_FORM.innerHTML=fieldsHtml+'<button class="btn primary" type="submit" style="width:100%;margin-top:6px">حفظ</button>';
  if(!SHEET_FORM._l){
    SHEET_FORM.addEventListener('submit',function(ev){
      ev.preventDefault();
      var fd=new FormData(SHEET_FORM);
      var o={};
      for(var p of fd.entries())o[p[0]]=p[1];
      if(SHEET_FORM._cb(o)!==false)closeSheet();
    });
    SHEET_FORM._l=true;
  }
  SHEET_FORM._cb=onSubmit;
  SHEET.classList.remove('hidden');
  setTimeout(function(){var i=SHEET_FORM.querySelector('input');if(i)try{i.focus();}catch(e){}},80);
}
function closeSheet(){SHEET.classList.add('hidden');}
document.getElementById('sheetClose').onclick=closeSheet;
document.getElementById('sheetBack').onclick=closeSheet;

function field(label,inner){return '<label class="field"><span>'+label+'</span>'+inner+'</label>';}
function textIn(name,val,ph){return '<input name="'+name+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'" autocomplete="off">';}
function numIn(name,val,ph){return '<input name="'+name+'" type="number" inputmode="decimal" step="any" value="'+esc(val)+'" placeholder="'+esc(ph)+'" autocomplete="off">';}

function openMillSheet(existing){
  var fields=field('اسم المطحنة',textIn('name',existing?existing.name:'','مثال: مطحنة الفرات'))
    +field('ملاحظات (اختياري)',textIn('notes',existing?existing.notes:'','موقع، ملاحظات أخرى'));
  openSheet(existing?'تعديل المطحنة':'مطحنة جديدة',fields,function(o){
    if(!o.name.trim()){toast('اكتب اسم المطحنة');return false;}
    if(existing){existing.name=o.name.trim();existing.notes=o.notes.trim();}
    else DB.mills.push({id:newId(),name:o.name.trim(),year:S.year,month:S.month,notes:o.notes.trim()});
    save();render();return true;
  });
}

function openAgentSheet(existing){
  var fields=field('اسم الوكيل',textIn('name',existing?existing.name:'','مثال: أبو علي'))
    +field('رقم الهاتف (اختياري)',textIn('phone',existing?existing.phone:'','07xx xxx xxxx'))
    +'<label class="switch-row" style="margin-top:4px"><span>حاسبته؟ حساب الوكيل وصل</span>'
    +'<input type="checkbox" name="settled"'+(existing&&existing.settled?' checked':'')+' id="setChk"><span class="track"></span></label>';
  openSheet(existing?'تعديل الوكيل':'وكيل جديد',fields,function(o){
    if(!o.name.trim()){toast('اكتب اسم الوكيل');return false;}
    if(existing){existing.name=o.name.trim();existing.phone=o.phone.trim();existing.settled=!!o.settled;}
    else DB.agents.push({id:newId(),millId:S.millId,name:o.name.trim(),phone:o.phone.trim(),settled:!!o.settled?1:0,delivered:0});
    save();render();return true;
  });
}

function openTxSheet(existing){
  var t=existing;
  var fields=field('التاريخ','<input name="date" type="date" value="'+(t?t.date:todayStr())+'">')
    +field('عدد الأكياس',numIn('sacks',t?_dropZeros(t.sacks):'','مثال: 100'))
    +field('سعر شراء الكيس',numIn('buy',t?_dropZeros(t.buy):'','مثال: 150000'))
    +field('سعر بيع الكيس',numIn('sell',t?_dropZeros(t.sell):'','مثال: 155000'))
    +field('ملاحظات (اختياري)','<textarea name="notes" placeholder="مثال: نوع الطحين، الشحنة...">'+esc(t?t.notes:'')+'</textarea>')
    +'<label class="switch-row" style="margin-top:4px"><span>هل وصلت شحنة التوصيل؟</span>'
    +'<input type="checkbox" name="delivered"'+(t&&t.delivered?' checked':'')+' id="delChk"><span class="track"></span></label>'
    +'<label class="switch-row" style="margin-top:4px"><span>دفعت فلوس شراء الأكياس؟</span>'
    +'<input type="checkbox" name="paid"'+(t&&t.paid?' checked':'')+' id="paidChk"><span class="track"></span></label>';
  openSheet(t?'تعديل العملية':'عملية جديدة',fields,function(o){
    var sacks=parsenum(o.sacks),buy=parsenum(o.buy),sell=parsenum(o.sell),date=o.date||todayStr();
    if(sacks<=0){toast('اكتب عدد الأكياس');return false;}
    if(t){t.sacks=sacks;t.buy=buy;t.sell=sell;t.date=date;t.delivered=!!o.delivered;t.paid=!!o.paid;t.notes=o.notes.trim();}
    else DB.txs.push({id:newId(),agentId:S.agentId,date:date,sacks:sacks,buy:buy,sell:sell,delivered:!!o.delivered?1:0,paid:!!o.paid?1:0,notes:o.notes.trim()});
    save();render();return true;
  });
}
function _dropZeros(v){return v===Math.round(v)?String(Math.round(v)):String(v);}

function openYearSheet(){
  MENU.classList.add('hidden');
  var ys=years(),maxY=new Date().getFullYear(),i;
  for(i=0;i<DB.years.length;i++)if(DB.years[i]>maxY)maxY=DB.years[i];
  for(i=0;i<ys.length;i++)if(ys[i]>maxY)maxY=ys[i];
  var fields=field('السنة الجديدة','<input name="year" type="number" inputmode="numeric" value="'+(maxY+1)+'">');
  openSheet('إضافة سنة جديدة',fields,function(o){
    var y=Math.round(parsenum(o.year));
    if(y<2000||y>2100){toast('اكتب سنة صحيحة');return false;}
    if(DB.years.indexOf(y)<0)DB.years.push(y);
    save();go('home',{year:y});return true;
  });
}

document.getElementById('reportBtn').onclick=function(){go('report');};

function openCurrency(){
  MENU.classList.add('hidden');
  var fields=field('رمز العملة',textIn('currency',DB.currency,'مثال: د.ع'));
  openSheet('رمز العملة',fields,function(o){

    DB.currency=o.currency.trim();save();render();return true;
  });

function exportBackup(){
  MENU.classList.add('hidden');
  var blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='دفتر-الطحين-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},100);

var FILE_IN=document.createElement('input');
FILE_IN.type='file';
FILE_IN.accept='.json,application/json';
FILE_IN.style.display='none';
document.body.appendChild(FILE_IN);
FILE_IN.onchange=function(){
  var f=FILE_IN.files[0];FILE_IN.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.mills)||!Array.isArray(d.agents)||!Array.isArray(d.txs))throw 0;
      confirmBox('استيراد نسخة','سيتم استبدال كل البيانات الحالية بالنسخة المستوردة',function(){
        DB=normDB(d);
        save();render();toast('تم الاستيراد');
      },'استيراد');
    }catch(e){toast('الملف غير صالح');}
  };
  r.readAsText(f);
};

function toggleDelivered(agentId){
  var txs=txsForAgent(agentId);
  if(!txs.length){toast('لا توجد عملية لهذا الوكيل');return;}
  txs[0].delivered=!txs[0].delivered;
  save();render();
}
function delMill(id){
  var m=millById(id);if(!m)return;
  confirmBox('حذف المطحنة','سيتم حذف «'+m.name+'» وكل وكلائها وعملياتها',function(){
    DB.mills=DB.mills.filter(function(x){return x.id!==id;});
    DB.txs=DB.txs.filter(function(x){var a=agentById(x.agentId);return !a||a.millId!==id;});
    DB.agents=DB.agents.filter(function(x){return x.millId!==id;});
    save();render();toast('تم حذف المطحنة');
  });
}
function delAgent(id){
  var a=agentById(id);if(!a)return;
  confirmBox('حذف الوكيل','سيتم حذف «'+a.name+'» وكل عملياته',function(){
    DB.agents=DB.agents.filter(function(x){return x.id!==id;});
    DB.txs=DB.txs.filter(function(x){return x.agentId!==id;});
    save();render();toast('تم حذف الوكيل');
  });
}
function delTx(id){
  var t=DB.txs.find(function(x){return x.id===id;});if(!t)return;
  confirmBox('حذف العملية',fmtSacks(t.sacks)+' بتاريخ '+fmtDate(t.date),function(){
    DB.txs=DB.txs.filter(function(x){return x.id!==id;});
    save();render();toast('تم حذف العملية');
  });
}
function wipeAll(){
  confirmBox('مسح كل البيانات','سيتم حذف كل المطاحن والوكلاء والعمليات نهائياً',function(){
    DB=freshDB();save();S.screen='home';render();toast('تم مسح كل البيانات');
  },'مسح');
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  var act=el.dataset.act,id=+el.dataset.id;
  if(act==='back'){goBack();}
  else if(act==='report'){go('report');}
  else if(act==='month'){go('month',{month:+el.dataset.month});}
  else if(act==='year'){S.year=+el.dataset.year;render();}
  else if(act==='add-year'){openYearSheet();}
  else if(act==='sync'){syncNow();}
  else if(act==='show-code'){ensureCode();}
  else if(act==='copy-code'){copyCode();}
  else if(act==='link-help'){alert('لربط جوال ثانٍ بنفس الحساب:\n1) من هذا الجوال: القائمة → رمز الربط (يظهر لك تلقائياً)\n2) بالجوال الثاني: بشاشة الدخول اضغط "عندي رمز ربط من جوال آخر" والصقه\n3) ادخل بنفس البريد وكلمة المرور — وستتجمع بياناتك معاً');}
  else if(act==='open-mill'){go('agents',{millId:id});}
  else if(act==='open-agent'){go('tx',{agentId:id});}
  else if(act==='add-mill'){openMillSheet(null);}
  else if(act==='add-agent'){openAgentSheet(null);}
  else if(act==='add-tx'){openTxSheet(null);}
  else if(act==='edit-mill'){openMillSheet(millById(id));}
  else if(act==='edit-agent'){openAgentSheet(agentById(id));}
  else if(act==='edit-tx'){openTxSheet(DB.txs.find(function(x){return x.id===id;}));}
  else if(act==='del-mill'){delMill(id);}
  else if(act==='del-agent'){delAgent(id);}
  else if(act==='del-tx'){delTx(id);}
  else if(act==='toggle-del'){toggleDelivered(id);}
  else if(act==='toggle-tx-del'){var t2=DB.txs.find(function(x){return x.id===id;});if(t2){t2.delivered=t2.delivered?0:1;save();render();}}
  else if(act==='toggle-paid'){var tt=DB.txs.find(function(x){return x.id===id;});if(tt){tt.paid=tt.paid?0:1;save();render();}}
  else if(act==='toggle-settle'){var ag=agentById(id);if(ag){ag.settled=ag.settled?0:1;save();render();}}
  else if(act==='agent-filter'){AGF=el.dataset.f;render();}
  else if(act==='open-agentsall'){AGF=el.dataset.f||'all';go('agentsall');}
  else if(act==='signout'){MENU.classList.add('hidden');endSession();}
  else if(act==='switchacc'){MENU.classList.add('hidden');endSession();}
  else if(act==='currency'){openCurrency();}
  else if(act==='export'){exportBackup();}
  else if(act==='import'){MENU.classList.add('hidden');FILE_IN.click();}
  else if(act==='wipe'){wipeAll();}
});
document.getElementById('backBtn').onclick=goBack;
document.getElementById('backBtn').innerHTML=I.back;

function boot(){
  window.addEventListener('error',function(ev){showBanner('حصل خطأ تقني — صوّر الرسالة وخبّرنا: '+(ev.message||'غير معروف'),'err');});
  window.addEventListener('online',function(){if(AUTH==='ready')syncNow();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&AUTH==='ready'){if(_dirty)saveNow();attachSync();}});
  setInterval(function(){if(AUTH==='ready'&&_dirty)saveNow();},15000);
  render();
  var ss=readSS();
  if(!ss){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf(LS_CACHE)===0){
          var o=JSON.parse(localStorage.getItem(k)||'{}');
          if(o&&Array.isArray(o._ss)&&o._ss[0]&&o._ss[1]){ss=o._ss;break;}
        }
      }
    }catch(e){}
  }
  if(ss&&ss[0]&&ss[1]){
    var em=String(ss[0]).toLowerCase();
    var cached=restoreFromCache(em);
    if(cached){
      AUTH='login';USER_EMAIL=em;PS=String(ss[1]);REG='';
      DB=normDB(cached);
      finishLogin(em);
      cloudTry(em,PS,'login').then(function(r){
        if(r&&r.st==='ok'&&AUTH==='ready'){
          var rd=normDB(r.d);
          if((rd.txs||[]).length>(DB.txs||[]).length&&(rd.txs||[]).length>(cached.txs||[]).length){DB=rd;CLOUD_ETAG=r.etag;S.screen='home';render();toast('تم تحديث بياناتك من السحابة');}
        }
      });
    }else{
      autoLogin(ss[0],ss[1]);
    }
  }
}
boot();
